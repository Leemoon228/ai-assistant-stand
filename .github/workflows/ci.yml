name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Check stand configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSO_SHARED_SECRET: ci-only-fixture
      GRAFANA_ADMIN_PASSWORD: ci-only-fixture
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test release integrity checks
        run: python -m unittest discover -s tests -v
      - name: Validate Compose
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example --profile monitoring config --quiet

  release:
    name: Publish stand release
    needs: [verify, security]
    if: ${{ github.repository == 'Leemoon228/ai-assistant-stand' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    concurrency:
      group: stand-release-${{ github.ref }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Resolve component versions once
        id: prepare
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          output="$RUNNER_TEMP/stand-release"
          mkdir -p "$output"
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [ "$draft" = false ]; then
              echo "Release $GITHUB_REF_NAME is already published."
              echo 'publish=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "$GITHUB_REF_NAME" --notes 'Preparing and checking the local stand.'
          fi
          assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          if printf '%s\n' "$assets" | grep -qx 'resolution.json'; then
            gh release download "$GITHUB_REF_NAME" --pattern resolution.json --dir "$output"
          else
            if [ -f "releases/$GITHUB_REF_NAME.json" ]; then
              cp "releases/$GITHUB_REF_NAME.json" "$output/resolution.json"
            else
              python scripts/assemble.py --resolve --resolution "$output/resolution.json"
            fi
            gh release upload "$GITHUB_REF_NAME" "$output/resolution.json"
          fi
          echo 'publish=true' >> "$GITHUB_OUTPUT"
      - name: Download and verify selected component releases
        if: steps.prepare.outputs.publish == 'true'
        run: python scripts/assemble.py --resolution "$RUNNER_TEMP/stand-release/resolution.json" --output "$RUNNER_TEMP/stand"
      - name: Check stand startup and configured remote LLM
        if: steps.prepare.outputs.publish == 'true'
        run: python scripts/smoke.py "$RUNNER_TEMP/stand" --with-generation
      - name: Package and publish complete stand
        if: steps.prepare.outputs.publish == 'true'
        shell: bash
        run: |
          output="$RUNNER_TEMP/stand-release"
          python scripts/bundle.py "$RUNNER_TEMP/stand" "$output"
          gh release upload "$GITHUB_REF_NAME" "$output"/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest --notes-file "$output/README.md"

  security:
    name: Security scans
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1
      SEMGREP_IMAGE: semgrep/semgrep:1.184.0
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create report directory
        run: mkdir -p "$RUNNER_TEMP/ci-reports"
      - name: Check Git history and files for secrets
        run: |
          scan() {
            docker run --rm \
              -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
              -v "$GITHUB_WORKSPACE:/repo:ro" -v "$RUNNER_TEMP/ci-reports:/reports" \
              "$GITLEAKS_IMAGE" "$@"
          }
          status=0
          scan git --log-opts=--all --redact=100 --report-format=json --report-path=/reports/gitleaks-history.json /repo || status=$?
          scan dir --redact=100 --report-format=json --report-path=/reports/gitleaks-files.json /repo || status=$?
          exit "$status"
      - name: Analyze source code
        if: ${{ !cancelled() }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" -v "$RUNNER_TEMP/ci-reports:/reports" \
            "$SEMGREP_IMAGE" semgrep scan --config p/default --metrics=off --disable-version-check \
            --json-output=/reports/semgrep.json /src
      - name: Upload security reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: security-reports
          path: ${{ runner.temp }}/ci-reports/
          retention-days: 14

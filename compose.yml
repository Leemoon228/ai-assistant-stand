name: ai-assistant-stand

services:
  frontend:
    image: ${FRONTEND_IMAGE:?Extract the stand release first}
    pull_policy: never
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    environment:
      BACKEND_URL: http://backend:5005
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    image: ${BACKEND_IMAGE:?Extract the stand release first}
    pull_policy: never
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5005}:5005"
    environment:
      PORT: "5005"
      FASTAPI_HOST: http://ml:8000
      MARKETPLACE_BASE_URL: http://marketplace-mock:8081
      SSO_SHARED_SECRET: ${SSO_SHARED_SECRET:?Set a stand-specific SSO_SHARED_SECRET}
    depends_on:
      ml:
        condition: service_healthy
      marketplace-mock:
        condition: service_started
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5005/hello').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30

  ml:
    image: ${ML_IMAGE:?Extract the stand release first}
    pull_policy: never
    ports:
      - "127.0.0.1:${ML_PORT:-8000}:8000"
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://130.49.188.18:11434}
      OLLAMA_FALLBACK_URL: ${OLLAMA_FALLBACK_URL:-http://130.49.188.18:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30

  marketplace-mock:
    image: ${MARKETPLACE_MOCK_IMAGE:?Extract the stand release first}
    pull_policy: never
    ports:
      - "127.0.0.1:${MARKETPLACE_PORT:-8081}:8081"
    environment:
      SSO_SHARED_SECRET: ${SSO_SHARED_SECRET:?Set a stand-specific SSO_SHARED_SECRET}
      ASSISTANT_FRONTEND_URL: http://localhost:${FRONTEND_PORT:-8080}
    volumes:
      - marketplace-data:/app/data

  webhook-receiver:
    image: ${WEBHOOK_RECEIVER_IMAGE:?Extract the stand release first}
    pull_policy: never
    profiles: [monitoring]

  prometheus:
    image: prom/prometheus:v3.0.1
    profiles: [monitoring]
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  loki:
    image: grafana/loki:3.3.0
    profiles: [monitoring]
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    volumes:
      - loki-data:/loki

  promtail:
    image: grafana/promtail:3.3.0
    profiles: [monitoring]
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on: [loki]

  grafana:
    image: grafana/grafana:11.3.0
    profiles: [monitoring]
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set a stand-specific Grafana password}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus, loki, webhook-receiver]

volumes:
  marketplace-data:
  prometheus-data:
  loki-data:
  grafana-data:
